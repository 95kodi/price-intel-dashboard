# Scheduled price scan: imports phone models from GoFix GetModelList into the
# PHP API on Hostinger, then searches/scrapes each store in parallel and posts
# prices back.
#
# Repo setup (Settings → Secrets and variables → Actions):
#   Variables: API_BASE        e.g. https://yourdomain.com/api
#   Secrets:   SCRAPE_TOKEN    same value as scrape_token in backend-php/config.php
#              SCRAPER_GATEWAY_URL / SCRAPER_PROXY_URL   optional, for stores that block GitHub's IPs
name: Scrape prices

on:
  schedule:
    # 06:00, 12:00 and 18:00 IST.
    - cron: "30 0,6,12 * * *"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Stores to scan, comma-separated (blank = all), e.g. flipkart,poorvika"
        default: ""
      limit:
        description: "Only the newest N models (0 = all)"
        default: "0"
      research:
        description: "Re-search models a store recently didn't have"
        type: boolean
        default: false
      dry_run:
        description: "Scrape but don't save"
        type: boolean
        default: false

# One scan at a time; a slow run shouldn't overlap the next schedule.
concurrency:
  group: scrape-prices
  cancel-in-progress: false

jobs:
  sync-models:
    runs-on: ubuntu-latest
    steps:
      - name: Import models from GetModelList
        env:
          API_BASE: ${{ vars.API_BASE }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
        run: |
          curl -fsS --max-time 120 -X POST -H "X-Scrape-Token: $SCRAPE_TOKEN" "$API_BASE/models/sync"

  scrape:
    needs: sync-models
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        # One job per store, so a store that blocks GitHub doesn't hold up the rest.
        platform: [flipkart, poorvika, sangeetha, chennai, sathya, croma, reliance, amazon]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Skip unless selected
        id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          wanted=",${PLATFORMS// /},"
          if [ -z "$PLATFORMS" ] || [[ "$wanted" == *",$PLATFORM,"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.pick.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.pick.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install and bundle
        if: steps.pick.outputs.run == 'true'
        working-directory: agent
        run: |
          npm ci --no-audit --no-fund
          npm run bundle:models

      - name: Scan ${{ matrix.platform }}
        if: steps.pick.outputs.run == 'true'
        working-directory: agent
        env:
          API_BASE: ${{ vars.API_BASE }}
          SCRAPE_TOKEN: ${{ secrets.SCRAPE_TOKEN }}
          SCRAPER_GATEWAY_URL: ${{ secrets.SCRAPER_GATEWAY_URL }}
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          SCAN_SOURCE: GitHub Actions
          # The catalogue is a chosen list that includes older best sellers
          # (iPhone 12, Pixel 7a), so no model is too old to search for.
          MAX_MODEL_AGE_YEARS: "0"
          PLATFORM: ${{ matrix.platform }}
          LIMIT: ${{ inputs.limit }}
          RESEARCH: ${{ inputs.research }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # --variants: every storage + colour each store lists gets its own price.
          args=(--platform "$PLATFORM" --variants)
          [[ "$LIMIT" =~ ^[1-9][0-9]*$ ]] && args+=(--limit "$LIMIT")
          [ "$RESEARCH" = "true" ] && args+=(--research)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node dist/models-scan.cjs "${args[@]}"
